<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowLime" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C8FF00" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#050505"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- frame corners -->
  <path d="M40 24 H90 M40 24 V56" stroke="#B026FF" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M1160 24 H1110 M1160 24 V56" stroke="#C8FF00" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M40 376 H90 M40 376 V344" stroke="#C8FF00" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M1160 376 H1110 M1160 376 V344" stroke="#B026FF" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- status readouts -->
  <circle cx="52" cy="40" r="4" fill="#C8FF00"/>
  <text x="66" y="44" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#9a9a9a" letter-spacing="1">STATUS: BUILDING</text>

  <circle cx="1090" cy="40" r="4" fill="#B026FF"/>
  <text x="1076" y="44" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#9a9a9a" letter-spacing="1" text-anchor="end">SIGNAL: ACTIVE</text>

  <!-- glow layer behind name -->
  <text x="600" y="215" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="92" font-weight="700" fill="#B026FF" opacity="0.55" filter="url(#glowPurple)">ANIKA KOTHARI</text>
  <!-- crisp name -->
  <text x="600" y="215" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="92" font-weight="700" fill="#F5F5F5" letter-spacing="2">ANIKA KOTHARI</text>

  <!-- divider tick -->
  <line x1="560" y1="252" x2="640" y2="252" stroke="#C8FF00" stroke-width="2" filter="url(#glowLime)"/>

  <!-- tagline -->
  <text x="600" y="292" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="19" fill="#C8FF00" letter-spacing="6" filter="url(#glowLime)">ELECTRONICS × SOFTWARE × AI</text>

  <!-- subline -->
  <text x="600" y="330" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8a8a8a">building the layer where a signal becomes a decision</text>
</svg>
