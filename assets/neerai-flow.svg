<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C8FF00"/>
    </marker>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="#050505"/>
  <text x="30" y="34" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#B026FF" letter-spacing="2">NEERAI // SIGNAL FLOW</text>
  <text x="1170" y="34" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" fill="#5a5a5a" letter-spacing="1">FIG. 01</text>

  <!-- nodes -->
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="13" font-weight="700" letter-spacing="0.5">
    <!-- node 1 -->
    <rect x="30" y="120" width="150" height="60" rx="6" fill="#0c0c0c" stroke="#B026FF" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="105" y="155" text-anchor="middle" fill="#F5F5F5">COMPUTE</text>

    <!-- node 2 -->
    <rect x="228" y="120" width="150" height="60" rx="6" fill="#0c0c0c" stroke="#B026FF" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="303" y="155" text-anchor="middle" fill="#F5F5F5">WORKLOAD</text>

    <!-- node 3 -->
    <rect x="426" y="120" width="150" height="60" rx="6" fill="#0c0c0c" stroke="#B026FF" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="501" y="155" text-anchor="middle" fill="#F5F5F5">PREDICTION</text>

    <!-- node 4 -->
    <rect x="624" y="120" width="150" height="60" rx="6" fill="#0c0c0c" stroke="#C8FF00" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="699" y="155" text-anchor="middle" fill="#F5F5F5">WATER STRESS</text>

    <!-- node 5 -->
    <rect x="822" y="120" width="150" height="60" rx="6" fill="#0c0c0c" stroke="#B026FF" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="897" y="155" text-anchor="middle" fill="#F5F5F5">OPTIMIZE</text>

    <!-- node 6 -->
    <rect x="1020" y="120" width="150" height="60" rx="6" fill="#0c0c0c" stroke="#C8FF00" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="1095" y="155" text-anchor="middle" fill="#F5F5F5">SCHEDULE</text>
  </g>

  <!-- arrows -->
  <g stroke="#C8FF00" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="180" y1="150" x2="222" y2="150"/>
    <line x1="378" y1="150" x2="420" y2="150"/>
    <line x1="576" y1="150" x2="618" y2="150"/>
    <line x1="774" y1="150" x2="816" y2="150"/>
    <line x1="972" y1="150" x2="1014" y2="150"/>
  </g>

  <text x="600" y="230" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8a8a8a">latency · energy · regional water stress · load — routed as one decision, not four</text>
</svg>
